version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/app"
      - "/nginx"
    schedule: { interval: "weekly" }
    target-branch: "main"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker-compose"
    directory: "."
    schedule: { interval: "weekly" }
    target-branch: "main"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/app"
    schedule: { interval: "monthly" }
    target-branch: "main"
    ignore:
      - dependency-name: "notebook"
      # 0.0.7 ships a SyntaxError (keyword argument repeated: timestamp): Django cannot load its URLs
      - dependency-name: "private-captcha"
        versions: ["0.0.7"]
    groups:
      production:
        dependency-type: 'production'
        patterns:
          - '*'
      development:
        dependency-type: 'development'
        patterns:
          - '*'
