services:
  nginx-proxy:
    container_name: nginx-proxy
    build: ./nginx
    restart: unless-stopped
    ports:
      - 443:443
      - 80:80
    depends_on:
      - web
    volumes:
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    environment:
      - TRUST_DOWNSTREAM_PROXY=false

  nginx-letsencrypt:
    cap_drop: ["ALL"]
    image: nginxproxy/acme-companion:2.5.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy

  web:
    cap_drop: ["ALL"]
    restart: unless-stopped
    build:
      context: ./app
      dockerfile: ./Dockerfile
      target: app_web
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # $$ defers expansion to the container shell; VIRTUAL_HOST is unset in dev and test.
      # /tmp/drain comes from the docker-rollout pre-stop hook below: nginx-proxy drops an unhealthy web (nginx/Dockerfile).
      test: ["CMD-SHELL", "test ! -e /tmp/drain && curl -fsS -o /dev/null -H \"Host: $${VIRTUAL_HOST:-localhost}\" http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    labels:
      com.github.nginx-proxy.nginx-proxy.keepalive: "disabled"
      # Unhealthy within 15 s (3 failed probes, 5 s apart), nginx reloads, then docker rollout stops the container.
      docker-rollout.pre-stop-hook: "touch /tmp/drain && sleep 25"

  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    shm_size: 1gb
    restart: unless-stopped
    # Postgres treats SIGTERM as a smart shutdown: it waits for every client to
    # disconnect, exceeds the stop grace period and gets SIGKILLed, leaving the
    # cluster in recovery on the next boot. SIGINT is the fast shutdown.
    stop_signal: SIGINT
    stop_grace_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: while the image runs its init scripts, a temporary server
      # listens on the unix socket only, so a socket check reports ready too early
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    cap_drop: ["ALL"]
    build:
      context: ./app
      dockerfile: ./Dockerfile
      target: app_worker
    command: watchmedo auto-restart --directory=./ --pattern=*.py --recursive -- celery -A app worker -Q default --loglevel=WARNING --concurrency=3 -O fair
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    container_name: worker

  celery_beat:
    cap_drop: ["ALL"]
    build:
      context: ./app
      dockerfile: ./Dockerfile
      target: app_worker
    command: celery -A app beat --loglevel=WARNING -s ./data/celerybeat-schedule
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: celery_beat
    restart: unless-stopped

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4.1.4-alpine
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      retries: 5
      start_period: 20s
      timeout: 5s

  redis:
    image: redis:8.2.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5

  flower:
    cap_drop: ["ALL"]
    restart: unless-stopped
    image: mher/flower:2.0.1
    container_name: flower
    command: celery flower --url_prefix=flower
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  metabase:
    restart: unless-stopped
    image: metabase/metabase:v0.63.15.3
    container_name: metabase

volumes:
  postgres_data:
  rabbitmq_data:
